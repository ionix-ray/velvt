# TODO(security): SHA-pin all actions once verified
name: Publish Container

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-container-${{ github.ref }}
  cancel-in-progress: true

env:
  PROJECT_ID: theionixinference
  REGION: us-central1
  AR_REPO: velvet
  IMAGE_NAME: velvet-web
  CARGO_TERM_COLOR: always
  RUST_VERSION: "1.88.0"
  DIOXUS_CLI_VERSION: "0.7.6"

jobs:
  build-and-push:
    name: Build and Push Container
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@91182cccc01eb5e619899d80e4e971d6181294a7 # v2.10.1
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@71fee32a0bb7e97b4d33d548e7d957010649d8fa # v2.1.7
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@6189d56e4096ee891640bb02ac264be376592d6a # v2.1.1

      - name: Configure Docker auth
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1482605bfc5719782e1267fd0c0cc350fe7646b8 # stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-pub-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-pub-

      - name: Install Dioxus CLI
        run: cargo install dioxus-cli --version "=${{ env.DIOXUS_CLI_VERSION }}" --locked

      - name: Install wasm-opt (binaryen)
        run: sudo apt-get install -y --no-install-recommends binaryen

      - name: Build and push container
        env:
          IMAGE_TAG_SHA: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.AR_REPO }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          IMAGE_TAG_LATEST: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.AR_REPO }}/${{ env.IMAGE_NAME }}:latest
        run: |
          docker build \
            -f Containerfile \
            --build-arg BUILDKIT_INLINE_CACHE=1 \
            -t "$IMAGE_TAG_SHA" \
            -t "$IMAGE_TAG_LATEST" \
            .
          docker push "$IMAGE_TAG_SHA"
          docker push "$IMAGE_TAG_LATEST"

      - name: Trivy Image Scan (HIGH/CRITICAL)
        env:
          IMAGE_TAG_SHA: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.AR_REPO }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
        run: |
          TRIVY_VER="0.57.1"
          curl -fsSL "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VER}/trivy_${TRIVY_VER}_Linux-64bit.tar.gz" -o trivy.tgz
          tar -xzf trivy.tgz trivy
          ./trivy image \
            --scanners vuln \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            --format sarif \
            --output trivy-image.sarif \
            "$IMAGE_TAG_SHA"
          ./trivy image \
            --scanners vuln \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --format table \
            "$IMAGE_TAG_SHA"

      - name: Upload Trivy Image SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@662472033e021d55d94146f66f6058822b0b39fd # v3.27.0
        with:
          sarif_file: trivy-image.sarif
